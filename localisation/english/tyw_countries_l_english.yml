 POLITICS_FREDERICK_V_DESC:0 "King of Bohemia and Elector Palatine, Frederick V accepted the Bohemian crown against all advice — triggering a war that would consume Europe for three decades."
 POLITICS_PAL_FREDERICK_V_DESC:0 "The Winter King rules the Palatinate, his Bohemian gamble already lost. He seeks allies to reclaim what is his."
 POLITICS_FERDINAND_II_DESC:0 "Holy Roman Emperor and Archduke of Austria, Ferdinand II is a staunch Catholic determined to re-Catholicise the Empire by any means necessary."
 POLITICS_MAXIMILIAN_I_DESC:0 "Duke of Bavaria and leader of the Catholic League, Maximilian is a shrewd statesman who will use the war to expand Bavarian power."
 POLITICS_GUSTAV_ADOLF_DESC:0 "King of Sweden and one of the finest military commanders of the age, Gustav Adolf will not allow a Habsburg-dominated Protestant Europe."
 POLITICS_CHRISTIAN_IV_DESC:0 "King of Denmark and Norway, Christian IV sees the war as an opportunity to extend Danish influence over the Protestant princes of northern Germany."
 POLITICS_LOUIS_XIII_DESC:0 "King of France, guided by Cardinal Richelieu. France's interests are dynastic, not religious — a weakened Habsburg Empire serves France regardless of confession."
 POLITICS_PHILIP_III_DESC:0 "King of Spain and ruler of the Spanish Empire, Philip III must sustain the Road of Flanders and support his Habsburg cousins in Vienna."
 POLITICS_MAURICE_NASSAU_DESC:0 "Stadtholder of the Dutch Republic and master of siege warfare, Maurice of Nassau fights to secure Dutch independence from Spanish rule."
 POLITICS_JOHANN_GEORG_DESC:0 "Elector of Saxony, Johann Georg plays both sides — a Lutheran who fears radical Calvinism as much as Catholic imperialism."
 POLITICS_GEORG_WILHELM_DESC:0 "Elector of Brandenburg, Georg Wilhelm lacks the resolve to commit to either side, leaving Brandenburg exposed to armies marching in every direction."